    <!--
      These used to load from public CDNs. Oleander runs headless on the
      local network via mDNS (oleander.local); that network commonly has
      no internet uplink at all (a venue/rehearsal Wi-Fi, for instance),
      in which case every CDN request would fail and this page would never
      render. They're now vendored locally into web/static/ instead --
      see setup/vendor_assets.sh (run automatically by setup/install.sh).
    -->
    <script src="/vendor-jquery.min.js"></script>
    <link rel="stylesheet" href="/vendor-bootstrap-darkly.min.css">
    <link rel="stylesheet" href="/style.css">
    <script src="/vendor-tether.min.js"></script>

    <script src="/vendor-babel-standalone.min.js"></script>
    <script src="/app.jsx?dontcache=m" type="text/babel"></script>
  </head>

  <body>

</html>
